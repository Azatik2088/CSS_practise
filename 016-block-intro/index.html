<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn {
            border: 3px solid red;
            /* Красная рамка */
            padding: 15px 30px;
            /* Внутренние отступы: сверху/снизу 15px, слева/справа 30px */
            margin: 25px;
            /* Внешние отступы со всех сторон по 25px */
            background-color: yellow;
            /* Желтый фон (зальет область padding) */
            font-family: sans-serif;
        }

        .btn-2 {
            margin-left: 0;
            /* У второй кнопки уберем внешний отступ слева */
        }
    </style>
</head>

<body>
    <button class="btn btn-1">Кнопка 1</button>
    <button class="btn btn-2">Кнопка 2</button>
</body>

</html>
